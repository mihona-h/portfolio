<!-- Section: Heading (左パネル) -->
<section class="heading" aria-label="プロフィール">

  <!-- Top: ロゴ + アバター -->
  <div class="heading__top">
    <p class="heading__logo">
      MIHONA<br>
      HIRATA<br>
      PORTFOLIO
    </p>
    <div class="heading__avatar">
      <img src="assets/placeholder-avatar.svg" alt="Mihona Hirata">
    </div>
  </div>

  <!-- Middle: キャッチコピー + scroll -->
  <div class="heading__main">
    <div class="heading__copy">
      <p class="heading__heading-ja">
        寄り添って、<br>
        つくる。
      </p>
      <p class="heading__subtext">
        Webデザイン・コーディング<br>
        設計から実装まで、丁寧につくります。
      </p>
    </div>
    <p class="heading__scroll">scroll →</p>
  </div>

  <!-- Bottom: スキル + フッター -->
  <div class="heading__bottom">

    <!-- Part: Skills List -->
    <div class="skills-list">
      <span class="skills-list__label">SKILLS</span>
      <ul class="skills-list__items">
        <li class="skills-list__row">
          <span class="skills-list__category">デザイン</span>
          <span class="skills-list__tools">Figma / Canva</span>
        </li>
        <li class="skills-list__row">
          <span class="skills-list__category">フロント</span>
          <span class="skills-list__tools">HTML / CSS / Sass / JavaScript / jQuery / PHP</span>
        </li>
        <li class="skills-list__row">
          <span class="skills-list__category">CMS</span>
          <span class="skills-list__tools">WordPress</span>
        </li>
        <li class="skills-list__row">
          <span class="skills-list__category">運用</span>
          <span class="skills-list__tools">Git / GitHub / VSCode</span>
        </li>
      </ul>
    </div>

    <hr class="heading__divider">

    <div class="heading__footer">
      <!-- Part: Contact Button -->
      <a href="#contact" class="contact-btn">
        <span class="contact-btn__icon" aria-hidden="true"></span>
        <span class="contact-btn__text">CONTACT</span>
      </a>

      <div class="heading__works-count">
        <span class="heading__works-number">04</span>
        <span class="heading__works-label">WORKS</span>
      </div>
    </div>

  </div>
</section>
